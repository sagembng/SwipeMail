<title>SwipeMail Brand Directions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&family=Figtree:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky brand tabs on top, then one "brand board" at a time: spec column left, live swipe phone right. */
:root{
  --bg:#F3F4F6; --fg:#12141A; --muted:#5B6270; --line:#D9DCE3; --panel:#FFFFFF;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D0F14;--fg:#ECEEF3;--muted:#9AA1B0;--line:#262A35;--panel:#151821;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0F14;--fg:#ECEEF3;--muted:#9AA1B0;--line:#262A35;--panel:#151821;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1120px;margin:0 auto}
header.top{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
header.top h1{font:800 clamp(28px,5vw,44px)/1.05 "Bricolage Grotesque",var(--sans);letter-spacing:-.02em;margin:0;text-wrap:balance}
header.top p{margin:0;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--sans);
  padding:10px 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0}
.tab:hover{border-color:var(--fg)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab .dots{display:flex}
.tab .dots i{width:12px;height:12px;border-radius:50%;margin-left:-4px;border:2px solid var(--panel);display:block}
.tab .dots i:first-child{margin-left:0}
.tab[aria-selected="true"] .dots i{border-color:var(--fg)}
:focus-visible{outline:3px solid #6C8CFF;outline-offset:2px}

/* ---------- brand board ---------- */
.stage{background:var(--b-bg);color:var(--b-ink);font-family:var(--b-body);border-radius:22px;
  padding:clamp(16px,3vw,34px);display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:36px;border:1px solid var(--line)}
@media(max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.spec{display:flex;flex-direction:column;gap:30px;min-width:0}
.hero{display:flex;flex-direction:column;gap:12px}
.lockup{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:var(--b-mark-r);background:var(--b-accent);color:var(--b-on-accent);display:grid;place-items:center;border:var(--b-btn-b);box-shadow:var(--b-btn-sh);flex:none}
.mark svg{width:26px;height:26px}
.word{font:var(--b-word);letter-spacing:var(--b-word-ls);font-size:36px;line-height:1}
.hero h2{font:var(--b-h);letter-spacing:var(--b-h-ls);font-size:clamp(26px,4vw,38px);line-height:1.08;margin:6px 0 0;text-wrap:balance}
.hero p{margin:0;color:var(--b-muted);max-width:56ch}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.meta span{font:500 12px var(--b-mono);padding:5px 9px;border:1px solid var(--b-line);border-radius:var(--b-chip-r);color:var(--b-muted)}
.sec h3{font:500 11px var(--b-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--b-muted);margin:0 0 12px;display:flex;gap:10px;align-items:center}
.sec h3::after{content:"";flex:1;height:1px;background:var(--b-line)}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.sw{border:1px solid var(--b-line);border-radius:var(--b-card-r);overflow:hidden;background:var(--b-surface)}
.sw .chip-c{height:64px;border-bottom:1px solid var(--b-line)}
.sw div.t{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.sw b{font:600 13px var(--b-body)}
.sw code{font:400 12px var(--b-mono);color:var(--b-muted)}
.type{display:grid;gap:12px}
.fnt{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:baseline;padding:14px 0;border-top:1px solid var(--b-line)}
.fnt:first-child{border-top:0;padding-top:0}
.fnt small{font:500 11px var(--b-mono);color:var(--b-muted);text-transform:uppercase;letter-spacing:.1em;display:block}
.fnt small em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--b-ink);display:block;margin-top:3px;font-size:12px}
.fnt .s1{font:var(--b-h);letter-spacing:var(--b-h-ls);font-size:clamp(22px,3.4vw,30px);line-height:1.1;overflow-wrap:anywhere}
.fnt .s2{font:400 16px/1.5 var(--b-body)}
.fnt .s3{font:400 13px/1.5 var(--b-mono);color:var(--b-muted)}
@media(max-width:520px){.fnt{grid-template-columns:minmax(0,1fr);gap:4px}}
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.bb{font:var(--b-btn-f);padding:11px 18px;border-radius:var(--b-btn-r);border:var(--b-btn-b);cursor:pointer;
  box-shadow:var(--b-btn-sh);transition:transform .16s var(--b-spring),box-shadow .16s;color:var(--b-ink);background:var(--b-surface);letter-spacing:var(--b-btn-ls)}
.bb:hover{transform:var(--b-hover)}
.bb:active{transform:var(--b-press);box-shadow:var(--b-press-sh)}
.bb.primary{background:var(--b-accent);color:var(--b-on-accent)}
.bb.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.bb.ghost:hover{transform:none}
.chip{font:600 11px var(--b-mono);text-transform:uppercase;letter-spacing:.08em;padding:4px 9px;border-radius:var(--b-chip-r);border:var(--b-chip-b)}
.chip.act{background:color-mix(in srgb,var(--b-accent) 20%,transparent);color:var(--b-ink)}
.chip.fyi{background:transparent;color:var(--b-muted)}
.chip.promo{background:color-mix(in srgb,var(--b-star) 24%,transparent);color:var(--b-ink)}
.acts{display:flex;gap:14px;align-items:center}
.act{width:60px;height:60px;border-radius:var(--b-act-r);border:var(--b-act-b);background:var(--b-surface);display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--b-act-sh);transition:transform .16s var(--b-spring),background .16s,color .16s,box-shadow .16s;color:var(--c)}
.act svg{width:26px;height:26px}
.act:hover{background:var(--c);color:var(--b-on-c,#fff);transform:var(--b-hover)}
.act:active{transform:var(--b-press)}
.act.read{--c:var(--b-read);--b-on-c:var(--b-on-read)}
.act.star{--c:var(--b-star);--b-on-c:var(--b-on-star)}
.act.undo{--c:var(--b-muted);--b-on-c:var(--b-bg2);width:44px;height:44px}
.act.undo svg{width:20px;height:20px}
.motion{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.mo{border:1px solid var(--b-line);border-radius:var(--b-card-r);padding:12px 14px;background:var(--b-surface);display:flex;flex-direction:column;gap:4px}
.mo b{font:600 14px var(--b-body)}
.mo span{font-size:13px;color:var(--b-muted)}
.mo code{font:400 11.5px var(--b-mono);color:var(--b-ink);opacity:.8;margin-top:4px;overflow-wrap:anywhere}

/* ---------- phone + deck ---------- */
.phonecol{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.phone{width:min(344px,100%);height:640px;background:var(--b-bg2);border:var(--b-phone-b);border-radius:38px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--b-phone-sh);position:relative;overflow:hidden}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pbar .mini{display:flex;align-items:center;gap:8px;font:var(--b-word);letter-spacing:var(--b-word-ls);font-size:19px}
.pbar .mini .mark{width:28px;height:28px;border-radius:calc(var(--b-mark-r) * .6);box-shadow:none}
.pbar .mini .mark svg{width:16px;height:16px}
.count{font:500 12px var(--b-mono);color:var(--b-muted)}
.prog{height:4px;background:var(--b-line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--b-accent);transition:width .4s var(--b-ease);border-radius:4px}
.deck{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;background:var(--b-surface);color:var(--b-ink);border:var(--b-card-b);border-radius:var(--b-card-r2);box-shadow:var(--b-card-sh);
  padding:20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y;will-change:transform;
  transform-origin:50% 90%}
.card.top{cursor:grab}
.card.top.dragging{cursor:grabbing}
.card.enter{animation:drop .38s var(--b-spring)}
@keyframes drop{from{transform:translateY(-36px) scale(1.04);opacity:0}to{transform:none;opacity:1}}
.c-head{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:var(--b-av-r);background:var(--avc);color:var(--b-on-av,#fff);display:grid;place-items:center;font:700 15px var(--b-body);flex:none;border:var(--b-av-b)}
.c-from{min-width:0;flex:1}
.c-from b{display:block;font:600 15px var(--b-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-from span{font:400 12px var(--b-mono);color:var(--b-muted)}
.c-subj{font:var(--b-h);letter-spacing:var(--b-h-ls);font-size:22px;line-height:1.15;margin:4px 0 0;text-wrap:balance}
.c-sum{font-size:15px;line-height:1.5;color:var(--b-ink);opacity:.86;margin:0}
.c-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hint{font:400 11.5px var(--b-mono);color:var(--b-muted);display:flex;align-items:center;gap:6px}
.hint i{width:8px;height:8px;border-radius:50%;background:var(--b-accent);display:block}
.stamp{position:absolute;top:22px;font:var(--b-stamp-f);letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border:var(--b-stamp-b);border-radius:var(--b-stamp-r);opacity:0;pointer-events:none;background:var(--b-stamp-bg,transparent)}
.stamp.s-read{right:18px;color:var(--b-read);border-color:var(--b-read);transform:rotate(10deg);--sb:var(--b-read)}
.stamp.s-star{left:18px;color:var(--b-star-ink,var(--b-star));border-color:var(--b-star);transform:rotate(-10deg);--sb:var(--b-star)}
.peek{position:absolute;inset:0;background:var(--b-surface);padding:20px;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .2s,transform .26s var(--b-ease);overflow:auto}
.card.previewing .peek{opacity:1;transform:none}
.peek h4{margin:0;font:var(--b-h);letter-spacing:var(--b-h-ls);font-size:17px}
.peek p{margin:0;font-size:14px;line-height:1.55}
.peek small{font:500 11px var(--b-mono);color:var(--b-muted);text-transform:uppercase;letter-spacing:.1em}
.pacts{display:flex;justify-content:center;align-items:center;gap:16px;padding-top:2px}
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.done h4{font:var(--b-h);letter-spacing:var(--b-h-ls);font-size:28px;margin:0}
.done p{margin:0;color:var(--b-muted)}
.hintline{font:400 12px var(--b-mono);color:var(--b-muted);text-align:center;max-width:34ch}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;animation:burst .7s var(--b-ease) forwards;z-index:5}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* ---------- brand tokens ---------- */
/* 1 Signal: precise, bright, blue */
.stage[data-brand="signal"]{
  --b-bg:#EEF1F8;--b-bg2:#F7F8FC;--b-surface:#FFFFFF;--b-ink:#0F1630;--b-muted:#5A647F;--b-line:#D5DAE8;
  --b-accent:#3355FF;--b-on-accent:#FFFFFF;--b-read:#12A87A;--b-on-read:#fff;--b-star:#FFB11F;--b-on-star:#3a2a00;--b-star-ink:#B97A00;
  --b-display:"Bricolage Grotesque";--b-body:"DM Sans",system-ui,sans-serif;--b-mono:"JetBrains Mono",ui-monospace,monospace;
  --b-h:700 1em/1.1 "Bricolage Grotesque",sans-serif;--b-h-ls:-.02em;--b-word:800 1em/1 "Bricolage Grotesque",sans-serif;--b-word-ls:-.03em;
  --b-btn-f:600 14px "DM Sans",sans-serif;--b-btn-ls:0;--b-btn-r:999px;--b-btn-b:1px solid #CBD2E6;--b-btn-sh:0 1px 2px rgba(15,22,48,.08);
  --b-hover:translateY(-1px);--b-press:scale(.96);--b-press-sh:none;--b-spring:cubic-bezier(.34,1.56,.64,1);--b-ease:cubic-bezier(.22,1,.36,1);
  --b-card-r:14px;--b-card-r2:26px;--b-card-b:1px solid #E1E5F0;--b-card-sh:0 18px 40px -18px rgba(15,22,48,.35);
  --b-act-r:50%;--b-act-b:1px solid var(--b-line);--b-act-sh:0 8px 18px -10px rgba(15,22,48,.4);--b-chip-r:999px;--b-chip-b:1px solid transparent;
  --b-mark-r:14px;--b-av-r:50%;--b-av-b:0;--b-phone-b:1px solid #D5DAE8;--b-phone-sh:0 30px 60px -30px rgba(15,22,48,.4);
  --b-stamp-f:800 20px "Bricolage Grotesque",sans-serif;--b-stamp-b:3px solid;--b-stamp-r:10px}
/* 2 Deep Sea: dark glass, teal glow */
.stage[data-brand="deepsea"]{
  --b-bg:#041216;--b-bg2:#071B21;--b-surface:#0E2A31;--b-ink:#E6F6F3;--b-muted:#8DB2B2;--b-line:#1C3E45;
  --b-accent:#2DD4BF;--b-on-accent:#03201D;--b-read:#2DD4BF;--b-on-read:#03201D;--b-star:#FF7A6B;--b-on-star:#2a0803;
  --b-body:"Figtree",system-ui,sans-serif;--b-mono:"IBM Plex Mono",ui-monospace,monospace;
  --b-h:700 1em/1.1 "Syne",sans-serif;--b-h-ls:-.01em;--b-word:800 1em/1 "Syne",sans-serif;--b-word-ls:-.02em;
  --b-btn-f:600 14px "Figtree",sans-serif;--b-btn-ls:.01em;--b-btn-r:14px;--b-btn-b:1px solid rgba(45,212,191,.28);--b-btn-sh:0 10px 28px -12px rgba(45,212,191,.55);
  --b-hover:translateY(-2px);--b-press:scale(.97);--b-press-sh:0 0 0 rgba(0,0,0,0);--b-spring:cubic-bezier(.2,1.4,.4,1);--b-ease:cubic-bezier(.16,1,.3,1);
  --b-card-r:16px;--b-card-r2:28px;--b-card-b:1px solid rgba(255,255,255,.08);--b-card-sh:0 30px 60px -24px rgba(0,0,0,.8),0 0 0 1px rgba(45,212,191,.08),0 0 60px -20px rgba(45,212,191,.35);
  --b-act-r:50%;--b-act-b:1px solid rgba(255,255,255,.12);--b-act-sh:0 0 24px -6px color-mix(in srgb,var(--c) 70%,transparent);--b-chip-r:8px;--b-chip-b:1px solid rgba(255,255,255,.1);
  --b-mark-r:16px;--b-av-r:14px;--b-av-b:0;--b-phone-b:1px solid #1C3E45;--b-phone-sh:0 40px 80px -30px rgba(45,212,191,.35);
  --b-stamp-f:800 19px "Syne",sans-serif;--b-stamp-b:2px solid;--b-stamp-r:12px;--b-stamp-bg:rgba(4,18,22,.6)}
/* 3 Editorial: paper, forest ink, stamps */
.stage[data-brand="editorial"]{
  --b-bg:#E6EAE1;--b-bg2:#EFF2EA;--b-surface:#FCFCF9;--b-ink:#18201A;--b-muted:#5D685F;--b-line:#C4CCC0;
  --b-accent:#1D6B47;--b-on-accent:#F4FAF6;--b-read:#1D6B47;--b-on-read:#fff;--b-star:#E3B100;--b-on-star:#241b00;--b-star-ink:#9A7600;
  --b-body:"Hanken Grotesk",system-ui,sans-serif;--b-mono:"IBM Plex Mono",ui-monospace,monospace;
  --b-h:600 1em/1.1 "Newsreader",Georgia,serif;--b-h-ls:-.015em;--b-word:600 1em/1 "Newsreader",Georgia,serif;--b-word-ls:-.02em;
  --b-btn-f:600 14px "Hanken Grotesk",sans-serif;--b-btn-ls:.02em;--b-btn-r:3px;--b-btn-b:1px solid #18201A;--b-btn-sh:none;
  --b-hover:translateY(-1px);--b-press:translateY(1px);--b-press-sh:none;--b-spring:cubic-bezier(.3,1.2,.5,1);--b-ease:cubic-bezier(.65,0,.35,1);
  --b-card-r:3px;--b-card-r2:6px;--b-card-b:1px solid #18201A;--b-card-sh:0 1px 0 #18201A,0 14px 26px -18px rgba(24,32,26,.5);
  --b-act-r:6px;--b-act-b:1.5px solid var(--c);--b-act-sh:none;--b-chip-r:2px;--b-chip-b:1px solid #18201A55;
  --b-mark-r:6px;--b-av-r:50%;--b-av-b:1px solid #18201A;--b-phone-b:1px solid #18201A;--b-phone-sh:0 24px 40px -30px rgba(24,32,26,.5);
  --b-stamp-f:600 20px "IBM Plex Mono",monospace;--b-stamp-b:3px double;--b-stamp-r:4px}
/* 4 Pop: neo-brutalist sticker energy */
.stage[data-brand="pop"]{
  --b-bg:#FFE14D;--b-bg2:#FFF3B0;--b-surface:#FFFFFF;--b-ink:#111111;--b-muted:#4A4A3A;--b-line:#111111;
  --b-accent:#4D7CFF;--b-on-accent:#FFFFFF;--b-read:#25C685;--b-on-read:#111;--b-star:#FF5D8F;--b-on-star:#111;
  --b-body:"Work Sans",system-ui,sans-serif;--b-mono:"Space Mono",ui-monospace,monospace;
  --b-h:400 1em/1.05 "Archivo Black",sans-serif;--b-h-ls:-.01em;--b-word:400 1em/1 "Archivo Black",sans-serif;--b-word-ls:-.02em;
  --b-btn-f:700 14px "Work Sans",sans-serif;--b-btn-ls:.01em;--b-btn-r:10px;--b-btn-b:2.5px solid #111;--b-btn-sh:4px 4px 0 #111;
  --b-hover:translate(-2px,-2px);--b-press:translate(4px,4px);--b-press-sh:0 0 0 #111;--b-spring:cubic-bezier(.3,1.9,.5,1);--b-ease:cubic-bezier(.6,-.2,.7,.4);
  --b-card-r:10px;--b-card-r2:18px;--b-card-b:3px solid #111;--b-card-sh:7px 7px 0 #111;
  --b-act-r:16px;--b-act-b:3px solid #111;--b-act-sh:4px 4px 0 #111;--b-chip-r:6px;--b-chip-b:2px solid #111;
  --b-mark-r:12px;--b-av-r:10px;--b-av-b:2.5px solid #111;--b-on-av:#111;--b-phone-b:3px solid #111;--b-phone-sh:8px 8px 0 #111;
  --b-stamp-f:400 20px "Archivo Black",sans-serif;--b-stamp-b:3px solid #111;--b-stamp-r:8px;--b-stamp-bg:var(--sb)}
.stage[data-brand="pop"] .stamp{color:#111!important}
.stage[data-brand="pop"] .act:hover{box-shadow:6px 6px 0 #111}
.stage[data-brand="pop"] .act:active{box-shadow:0 0 0 #111}
.stage[data-brand="pop"] .bb:hover{box-shadow:6px 6px 0 #111}
.stage[data-brand="pop"] .act{--b-hover:translate(-2px,-2px)}
.stage[data-brand="pop"] .act.undo{--c:#111}
.stage[data-brand="deepsea"] .bb.primary{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 10px 36px -8px rgba(45,212,191,.9)}}
.stage[data-brand="editorial"] .bb:not(.primary):not(.ghost):hover{background:#18201A;color:#FCFCF9}
.stage[data-brand="editorial"] .act:hover{box-shadow:inset 0 0 0 1px var(--c)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>SwipeMail brand directions</h1>

  fly:260,rot:20,fx:false,sread:'Read',sstar:'Star'},
 {id:'deepsea',name:'Deep Sea',dots:['#2DD4BF','#041216','#FF7A6B'],

  fonts:[['Display','Syne 700 / 800','Inbox, but calmer.'],['Body','Figtree 400 / 600','Dana says open enrollment ends in 7 days. Doing nothing means a 6% increase.'],['Data','IBM Plex Mono','Mon · 4 left · ends Nov 15']],

var tabsEl=document.getElementById('tabs'),board=document.getElementById('board');
BRANDS.forEach(function(b){
  var el=document.createElement('button');el.className='tab';el.setAttribute('role','tab');el.dataset.id=b.id;
  el.innerHTML='<span class="dots">'+b.dots.map(function(c){return '<i style="background:'+c+'"></i>'}).join('')+'</span>'+b.name;
  el.addEventListener('click',function(){location.hash=b.id;});tabsEl.appendChild(el);
});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function show(id){
  var b=BRANDS.filter(function(x){return x.id===id})[0]||BRANDS[0];
  Array.prototype.forEach.call(tabsEl.children,function(t){t.setAttribute('aria-selected',t.dataset.id===b.id?'true':'false')});
  board.innerHTML='<div class="stage" data-brand="'+b.id+'">'+
   '<div class="spec">'+
    '<div class="hero"><div class="lockup"><div class="mark">'+ICON.mark+'</div><div class="word">SwipeMail</div></div>'+
     '<h2>'+esc(b.fonts[0][2])+'</h2><p>'+esc(b.line)+'</p>'+
     '<div class="meta"><span>'+esc(b.best)+'</span><span>'+esc(b.mood)+'</span></div></div>'+
    '<div class="sec"><h3>Colour</h3><div class="swatches">'+b.sw.map(function(s){return '<div class="sw"><div class="chip-c" style="background:'+s[1]+'"></div><div class="t"><b>'+s[0]+'</b><code>'+s[1]+'</code></div></div>'}).join('')+'</div></div>'+
    '<div class="sec"><h3>Type</h3><div class="type">'+b.fonts.map(function(f,i){return '<div class="fnt"><small>'+f[0]+'<em>'+esc(f[1])+'</em></small><div class="s'+(i+1)+'">'+esc(f[2])+'</div></div>'}).join('')+'</div></div>'+
    '<div class="sec"><h3>Buttons and tags</h3><div class="btns"><button class="bb primary">Connect Gmail</button><button class="bb">Preview email</button><button class="bb ghost">Skip this sender</button></div>'+
     '<div class="btns" style="margin-top:16px"><span class="chip act">Action needed</span><span class="chip fyi">FYI</span><span class="chip promo">Promo</span></div>'+
     '<div class="acts" style="margin-top:18px"><button class="act undo" aria-label="Undo">'+ICON.undo+'</button><button class="act read" aria-label="Mark read">'+ICON.check+'</button><button class="act star" aria-label="Star">'+ICON.star+'</button></div></div>'+
    '<div class="sec"><h3>Motion</h3><div class="motion">'+b.motion.map(function(m){return '<div class="mo"><b>'+m[0]+'</b><span>'+m[1]+'</span><code>'+m[2]+'</code></div>'}).join('')+'</div></div>'+
   '</div>'+
   '<div class="phonecol"><div class="phone" id="phone"></div><div class="hintline">Drag left to mark read. Drag right to star. Press and hold for the full email.</div></div>'+
  '</div>';
  initDeck(b,document.getElementById('phone'));
}
function initDeck(b,phone){
  var idx=0,hist=[],busy=false,deck,count,prog,cards=[];
  phone.innerHTML='<div class="pbar"><div class="mini"><div class="mark">'+ICON.mark+'</div>SwipeMail</div><div class="count" id="cnt"></div></div>'+
   '<div class="prog"><i id="pg"></i></div><div class="deck" id="deck"></div>'+
   '<div class="pacts"><button class="act undo" id="bUndo" aria-label="Undo last swipe">'+ICON.undo+'</button><button class="act read" id="bRead" aria-label="Mark read">'+ICON.check+'</button><button class="act star" id="bStar" aria-label="Star">'+ICON.star+'</button></div>';
  deck=phone.querySelector('#deck');count=phone.querySelector('#cnt');prog=phone.querySelector('#pg');
  var pos=function(n){return 'translateY('+(n*11)+'px) scale('+(1-n*0.05)+')'};
  function cardHTML(m){
    return '<div class="stamp s-star">'+b.sstar+'</div><div class="stamp s-read">'+b.sread+'</div>'+
     '<div class="c-head"><div class="av" style="--avc:'+m.c+'">'+m.i+'</div><div class="c-from"><b>'+esc(m.n)+'</b><span>'+m.t+'</span></div><span class="chip '+m.tag+'">'+m.tl+'</span></div>'+
     '<h3 class="c-subj">'+esc(m.s)+'</h3><p class="c-sum">'+esc(m.m)+'</p>'+
     '<div class="c-foot"><span class="hint"><i></i>Hold to read full email</span></div>'+
     '<div class="peek"><small>Full email</small><h4>'+esc(m.s)+'</h4>'+m.b.map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div>';
  }
  function render(enter){
    deck.innerHTML='';cards=[];
    var left=MAILS.length-idx;
    count.textContent=left>0?left+' left':'0 left';
    prog.style.width=(idx/MAILS.length*100)+'%';
    if(left<=0){
      deck.innerHTML='<div class="done"><div class="mark">'+ICON.check+'</div><h4>Inbox clear</h4><p>You went through '+MAILS.length+' emails.</p><button class="bb primary" id="again">Start over</button></div>';
      deck.querySelector('#again').onclick=function(){idx=0;hist=[];render();};
      return;
    }
    for(var n=Math.min(2,left-1);n>=0;n--){
      var el=document.createElement('div');el.className='card'+(n===0?' top':'');
      el.innerHTML=cardHTML(MAILS[idx+n]);el.style.transform=n?pos(n):'';el.style.opacity=n===2?.6:1;el.style.zIndex=10-n;
      el.style.transition='transform .35s var(--b-ease),opacity .35s';
      if(n===0&&enter)el.classList.add('enter');
      deck.appendChild(el);cards[n]=el;
    }
    attach(cards[0]);
  }
  function stamps(el,dx){
    var r=el.querySelector('.s-read'),s=el.querySelector('.s-star'),a=Math.min(1,Math.abs(dx)/90);
    r.style.opacity=dx<0?a:0;s.style.opacity=dx>0?a:0;
    var k=1+a*.12;r.style.scale=dx<0?k:1;s.style.scale=dx>0?k:1;
  }
  function burst(dir){
    if(!b.fx)return;var w=deck.clientWidth,h=deck.clientHeight;
    var col=dir<0?getComputedStyle(deck).getPropertyValue('--b-read'):getComputedStyle(deck).getPropertyValue('--b-star');
    for(var i=0;i<14;i++){var s=document.createElement('i');s.className='spark';
      var a=Math.random()*Math.PI*2,d=60+Math.random()*90;
      s.style.cssText='left:'+(dir<0?w-40:40)+'px;top:'+(h*.25)+'px;background:'+col+';box-shadow:0 0 10px '+col+';--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px';
      deck.appendChild(s);setTimeout(function(x){x.remove()}.bind(null,s),720);}
  }
  function commit(dir,fromDrag,dy){
    if(busy||!cards[0])return;busy=true;
    var top=cards[0];top.style.transition='transform '+b.fly+'ms var(--b-ease),opacity '+b.fly+'ms';
    top.style.transform='translate('+(dir*520)+'px,'+((dy||0)+20)+'px) rotate('+(dir*28)+'deg)';top.style.opacity='0';
    stamps(top,dir*100);
    if(cards[1]){cards[1].style.transform='';cards[1].style.opacity=1}
    if(cards[2]){cards[2].style.transform=pos(1);cards[2].style.opacity=1}
    burst(dir);hist.push({dir:dir});
    setTimeout(function(){idx++;busy=false;render();},b.fly+30);
  }
  function undo(){if(busy||!hist.length)return;hist.pop();idx--;render(true);}
  phone.querySelector('#bRead').onclick=function(){commit(-1)};
  phone.querySelector('#bStar').onclick=function(){commit(1)};
  phone.querySelector('#bUndo').onclick=undo;
  function attach(el){
    var sx=0,sy=0,dx=0,dy=0,down=false,moved=false,timer=null,id=null;
    el.addEventListener('pointerdown',function(e){
      if(busy)return;down=true;moved=false;sx=e.clientX;sy=e.clientY;dx=dy=0;id=e.pointerId;
      try{el.setPointerCapture(id)}catch(_){}
      el.style.transition='none';el.classList.add('dragging');
      timer=setTimeout(function(){if(!moved){el.classList.add('previewing')}},420);
    });
    el.addEventListener('pointermove',function(e){
      if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;
      if(!moved&&Math.hypot(dx,dy)>8){moved=true;clearTimeout(timer);el.classList.remove('previewing')}
      if(!moved||el.classList.contains('previewing'))return;
      el.style.transform='translate('+dx+'px,'+dy*.4+'px) rotate('+(dx/b.rot)+'deg)';stamps(el,dx);
      var p=Math.min(1,Math.abs(dx)/140);
      if(cards[1])cards[1].style.transform='translateY('+(11*(1-p))+'px) scale('+(0.95+0.05*p)+')';
    });
    function end(){
      if(!down)return;down=false;clearTimeout(timer);el.classList.remove('dragging');
      if(el.classList.contains('previewing')){el.classList.remove('previewing');return}
      if(Math.abs(dx)>110){commit(dx<0?-1:1,true,dy*.4);return}
      el.style.transition='transform .5s var(--b-spring)';el.style.transform='';stamps(el,0);
      if(cards[1]){cards[1].style.transition='transform .5s var(--b-spring)';cards[1].style.transform=pos(1)}
    }
    el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
    el.addEventListener('contextmenu',function(e){e.preventDefault()});
  }
  render();
}
function route(){show((location.hash||'').replace('#','')||'signal')}
window.addEventListener('hashchange',route);route();
